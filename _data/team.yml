- name: Laurent Chen
  role: Junior Researcher
  affiliation: Department of Advanced Computing Sciences, Maastricht University
  bio: 'Laurent worked as a Junior Researcher on our NWO AiNed XS project in collaboration with TU Dresden until September 2026. He researched asynchronous event-driven neural networks for neuromorphic supercomputing. He also completed his master’s thesis at ERNIS, developing a software simulation and training framework for asynchronous neural networks.'
