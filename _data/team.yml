- name: Joshua Kramer
  role: Master Student (Master AI)
  affiliation: imec & Department of Advanced Computing Sciences, Maastricht University
  bio: 'Joshua completed his research internship at ERNIS on small language models at the edge using NVIDIA Jetson. His paper with Dr. Guangzhi Tang, “Beyond Sensor Streams: HALO-Agent as a Body-State Representation Layer for Wearable Agents,” was published at the WearAgent workshop at UbiComp/ISWC 2026. He is now working on his master’s thesis at imec under the continued supervision of Dr. Guangzhi Tang. <a href="https://wearagent.github.io/">View the workshop programme</a>.'
  photo: /assets/images/team/joshua-kramer.jpeg
  classes:
    - Master Students
  status: current
  start_year: 2026

- name: Aurora Pia Ghiardelli
  role: Junior Researcher
  affiliation: Department of Advanced Computing Sciences, Maastricht University
  bio: 'Aurora joined ERNIS as a Junior Researcher in November 2026 after completing her master’s thesis at imec on intracortical neural signal processing, jointly supervised by Dr. Yao-Hong Liu (imec), and winning the FSE thesis award. Her earlier research internship at ERNIS developed a reliable, energy-efficient framework for 3D brain tumor segmentation using spiking neural networks, resulting in a paper accepted at ISBI 2026. <a href="https://arxiv.org/abs/2601.16652">Read her ISBI paper</a>.'
  email: aurorapia.ghiardelli@maastrichtuniversity.nl
  photo: /assets/images/team/aurora-pia.jpeg
  classes:
    - Team Members
  status: current
  start_year: 2024

- name: Bas Körver
  role: Master Student (Master AI)
  affiliation: Department of Advanced Computing Sciences, Maastricht University
  bio: 'Bas completed his master’s thesis at ERNIS in 2026 on event-based vision and automated data collection for biodiversity monitoring of insects. He has a paper published at the NeVi workshop at ECCV 2026. <a href="https://openreview.net/pdf?id=ttipftOZwD">Read the paper</a>.'
