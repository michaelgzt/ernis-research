- name: Tudor Hermenean
  role: Master Student (Master AI)
  affiliation: imec & Department of Advanced Computing Sciences, Maastricht University
  bio: 'Tudor completed his master’s research internship at ERNIS on low-latency person detection with event-based vision and FPGA-based AI acceleration. He built an object detection pipeline using a Prophesee 1Mpix event-based camera and AMD KV260. He is now working on his master’s thesis at imec under the continued supervision of Dr. Guangzhi Tang.'
