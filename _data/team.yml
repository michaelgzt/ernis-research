- name: Karmanya Raizada
  role: Master Student (Master AI)
  affiliation: Department of Advanced Computing Sciences, Maastricht University
  bio: 'Karmanya completed his master’s thesis at ERNIS under the supervision of Dr. Guangzhi Tang during 2025–2026. Together with Joshua Kramer, he won the Most Creative Student Challenge Award at UbiComp/ISWC 2026 for “Poisoning the Hearth.” The project explored security threats to AI-powered smart homes and developed safeguards against misleading visual inputs, supervised by Dr. Theodor Schnitzler and Dr. Guangzhi Tang. <a href="https://www.ubicomp.org/ubicomp-iswc-2026/awards-all/">View the award</a>.'
  photo: /assets/images/team/karmanya-raizada.png
  classes:
    - Previous Members
  status: alumni
  start_year: 2025
  end_year: 2026

- name: Tauseef Ahmed
  role: Master Student (Master AI)
  affiliation: imec & Department of Advanced Computing Sciences, Maastricht University
  bio: 'Tauseef finished his master thesis at imec working on event-driven state space models for speech recognition and neuromorphic software simulation. His project was jointly supervised by Kanishkan Vadivel (imec). The results of his thesis were published at IJCNN. <a href="https://ieeexplore.ieee.org/abstract/document/11729420">Read the paper</a>.'
