- name: Francesca Rivelli
  role: Master Student (Master AI)
  affiliation: Department of Advanced Computing Sciences, Maastricht University
  bio: 'Francesca finished her master research internship project at ERNIS. Her work on ultra-efficient intracortical neural decoding using adaptively pruned spiking neural networks is published at EMBC 2025, the premier scientific conference for biomidical engineering. She presented the poster of her paper in EMBC at Copenhagen in the summer of 2025. <a href="https://ieeexplore.ieee.org/abstract/document/11254088">See her paper here</a>.'
  classes:
    - Previous Members
  status: alumni
  start_year: 2024
  end_year: 2025

- name: Ismael Gomez Garrido
  role: Master Student (Master AI)
  affiliation: Department of Advanced Computing Sciences, Maastricht University
  bio: 'Ismael finished his master thesis at ERNIS. His work shows it is possible to perform full integer arithmetic online training for spiking neural networks, paving the way for very efficient neural network training on embedded devices. His thesis work is published at ICANN 2025 and he gave an oral presentation on the paper in the conference at Kaunas in September of 2025. <a href="https://link.springer.com/chapter/10.1007/978-3-032-04558-4_45">See his paper here</a>.'
  photo: /assets/images/team/ismael-gomez.jpeg
  classes:
    - Previous Members
  status: alumni
  start_year: 2024
  end_year: 2025

- name: Sudi Wang
  role: Master Student (Master Data Science and Decision Making)
  affiliation: Department of Advanced Computing Sciences, Maastricht University
  bio: 'Sudi finished her master thesis at ERNIS. Her project worked on KV-cache compression for LLMs using recurrent memory states and efficient training policies. She was invited to give an oral presentation of her thesis work in the Application in AI track of NWO ICT.OPEN 2025.'
